name: ci
# Lint and tests on every change, and the Linux AppImage with the arca client
# built at the pinned commit and Bark's client and daemon built at the pinned
# release with its patch. Nothing is published: the AppImage is a CI artifact.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests
        run: npm test

  linux-build:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler
          rustup toolchain install stable --profile minimal
      # The target directory lives beside the clone, not in it: a cache
      # restored into the clone's directory would stop the clone.
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cache/target
            build/cache/target-bark
          key: arca-target-${{ hashFiles('build/ARCA_COMMIT', 'build/BARK_COMMIT', 'build/bark-testnet4.patch') }}-linux
      - name: The arca client at the pinned commit
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/cache/target
        run: npm ci && npm run bundle:arca
      - name: Bark at the pinned release, with its patch
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/cache/target-bark
        run: npm run bundle:bark
      - name: AppImage
        run: npm run dist:linux -- --publish never
      - name: No build path in what ships
        run: |
          set -euo pipefail
          app=$(ls dist/Arca-*-linux-x86_64.AppImage)
          for b in build/arca-linux-x64/bin/arca build/bark-linux-x64/bin/bark build/bark-linux-x64/bin/barkd; do
            for p in "$GITHUB_WORKSPACE" "$HOME/.cargo" "$HOME/.rustup"; do
              n=$(grep -a -c -F -- "$p" "$b" || true)
              [ "$n" = 0 ] || { echo "$b holds $p"; exit 1; }
            done
          done
          ls -l "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: Arca-linux-AppImage
          path: dist/Arca-*-linux-x86_64.AppImage
          if-no-files-found: error
