name: ci
# Lint and tests on every change, and the Linux AppImage with the arca client
# built at the pinned commit. Nothing is published: the AppImage is a CI
# artifact.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests
        run: npm test

  linux-build:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler
          rustup toolchain install stable --profile minimal
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cache/arca/target
          key: arca-${{ hashFiles('build/ARCA_COMMIT') }}-linux
      - name: The arca client at the pinned commit
        run: npm ci && npm run bundle:arca
      - name: AppImage
        run: npm run dist:linux -- --publish never
      - name: No build path in what ships
        run: |
          set -euo pipefail
          app=$(ls dist/Arca-*-linux-x86_64.AppImage)
          for p in "$GITHUB_WORKSPACE" "$HOME/.cargo" "$HOME/.rustup"; do
            n=$(grep -a -c -F -- "$p" build/arca-linux-x64/bin/arca || true)
            [ "$n" = 0 ] || { echo "arca holds $p"; exit 1; }
          done
          ls -l "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: Arca-linux-AppImage
          path: dist/Arca-*-linux-x86_64.AppImage
          if-no-files-found: error
