name: windows
# The Windows build, on demand: the arca client built natively at the pinned
# commit, then the zip and the one-file NSIS installer. It runs on a Windows
# runner because electron-builder's NSIS target edits the installer
# executable, which on Linux needs wine. Nothing is published: both are CI
# artifacts.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Toolchain
        shell: bash
        run: |
          choco install protoc -y --no-progress
          rustup toolchain install stable --profile minimal
      - name: The arca client at the pinned commit
        shell: bash
        run: |
          export PROTOC="$(command -v protoc)"
          TARGET=x86_64-pc-windows-msvc bash build/make-arca-bundle.sh
      - run: npm ci
      - name: Zip and installer
        shell: bash
        run: npx electron-builder --win nsis zip --publish never --config.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: Arca-windows
          path: |
            dist/Arca-Setup-*.exe
            dist/Arca-*-win64.zip
          if-no-files-found: error
